# BanqueJS — core pattern pack (France)
#
# Open-source default merchant→category patterns for well-known French /
# international chains. Seeded into the `rules` table at db:migrate.
#
# Contributing: add widely-recognized national/international merchants only.
# Keep hyper-local or personal merchants OUT of this file — put those in a
# private pack (`*.local.yaml`, gitignored) loaded via PATTERN_PACKS.
#
# Rule fields: `pattern` (required), `matchType` (contains|equals|starts_with|
# regex, default contains), `amountCondition` (any|positive|negative, default
# any), `priority` (lower wins; default 100).

name: core-fr
description: Default French/EU merchant patterns (open-source).

categories:
  - name: Alimentation
    color: "#16a34a"
    icon: ShoppingCart
    rules:
      - pattern: CARREFOUR
      - pattern: LECLERC
      - pattern: INTERMARCHE
      - pattern: AUCHAN
      - pattern: MONOPRIX
      - pattern: FRANPRIX
      - pattern: LIDL
      - pattern: PICARD
      - pattern: BIOCOOP
      - pattern: SUPER U
      - pattern: BISCUITERIE
      - pattern: BOULANGERIE
      - pattern: PANETIERE

  - name: Restaurants
    color: "#f97316"
    icon: UtensilsCrossed
    rules:
      - pattern: MCDONALD
      - pattern: BURGER KING
      - pattern: KFC
      - pattern: STARBUCKS
      - pattern: DELIVEROO
      - pattern: UBER EATS
      - pattern: FOODORA
      - pattern: RESTAURANT
      - pattern: BRASSERI
      - pattern: PIZZA

  - name: Transport
    color: "#0ea5e9"
    icon: Train
    rules:
      - pattern: SNCF
      - pattern: RATP
      - pattern: NAVIGO
      - pattern: UBER
        priority: 90
      - pattern: BLABLACAR
      - pattern: TOTAL
      - pattern: TOTALENERGIES
      - pattern: SHELL
      - pattern: ESSO
      - pattern: "BP "
      - pattern: PARKING
      - pattern: AUTOROUTE
      - pattern: VINCI
        matchType: starts_with
      - pattern: ESSENCE
      - pattern: STATION U
      - pattern: ALLOPNEUS
      # Word-boundary regex so "ASF" doesn't match other 3-letter substrings
      - pattern: '\bASF\b'
        matchType: regex

  - name: Logement
    color: "#a16207"
    icon: Home
    rules:
      - pattern: LOYER
      - pattern: BAILLEUR
      - pattern: SYNDIC
      - pattern: FONCIA
      - pattern: CITYA
      - pattern: ECH PRET
        priority: 80
      - pattern: PRET HABITAT

  - name: Énergie
    color: "#eab308"
    icon: Zap
    rules:
      - pattern: EDF
      - pattern: ENGIE
      - pattern: TOTALENERGIES ELEC
      - pattern: ENI

  - name: Télécom
    color: "#6366f1"
    icon: Smartphone
    rules:
      - pattern: FREE MOBILE
      - pattern: FREE TELECOM
      - pattern: FREE HAUT DEBIT
      - pattern: ORANGE
      - pattern: SFR
      - pattern: BOUYGUES TELECOM
