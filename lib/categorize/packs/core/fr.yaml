  - name: Apports
    color: "#10b981"
    icon: TrendingUp
    rules:
      - pattern: SALAIRE
        priority: 50
      - pattern: VIR SEPA SALAIRE
        priority: 50
      - pattern: REMUNERATION
        priority: 50
      - pattern: URSSAF REMB
        priority: 50
      - pattern: REM CHQ
        matchType: starts_with
        amountCondition: positive
        priority: 60
      - pattern: REMISE CHEQUE
        amountCondition: positive
        priority: 60
      # Generic incoming-money fallbacks: only when amount > 0
      - pattern: "VIR "
        matchType: starts_with
        amountCondition: positive
        priority: 250
      - pattern: VIREMENT
        amountCondition: positive
        priority: 250
      - pattern: VIR SEPA
        amountCondition: positive
        priority: 250

  - name: Assurances
    color: "#0891b2"
    icon: ShieldCheck
    rules:
      - pattern: AGIPI
      - pattern: ADIS
      - pattern: MAAF
      - pattern: MMA
      - pattern: GROUPAMA
      - pattern: MATMUT
      - pattern: MAIF
      - pattern: MACIF

  - name: Banque
    color: "#475569"
    icon: Landmark
    rules:
      - pattern: AXA
      - pattern: FRAIS BANCAIRES
      - pattern: COTISATION CARTE
      - pattern: AGIOS
      # Negative-only: the loan interest you pay. Some incoming apports may
      # include "VIR INTERETS CREDIT ..." (positive); that must not match here.
      - pattern: INTERETS CREDIT
        amountCondition: negative
        priority: 80
      - pattern: VIR REMB
        matchType: starts_with
      - pattern: PRET N
        matchType: starts_with
        amountCondition: positive
      - pattern: FRAIS DE DOSSIER
      - pattern: FRAIS COND

  - name: Impôts
    color: "#7c2d12"
