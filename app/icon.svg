<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 302 302" width="302" height="302" role="img" aria-label="BanqueJS">
  <title>BanqueJS</title>
  <!-- Favicon: the mark alone. Navy on light tab strips, switched to white in
       dark ones — a navy mark on a dark tab would be all but invisible. -->
  <style>
    .mark { fill: #0E2348; stroke: #0E2348; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #FFFFFF; stroke: #FFFFFF; }
    }
  </style>
  <g class="mark">
    <path d="M151 6 L292 92 H10 Z" stroke-width="12" stroke-linejoin="round"/>
    <rect x="25" y="120" width="58" height="18" rx="6" stroke="none"/>
    <rect x="37" y="134" width="34" height="114" rx="4" stroke="none"/>
    <rect x="25" y="242" width="58" height="18" rx="6" stroke="none"/>
    <rect x="122" y="120" width="58" height="18" rx="6" stroke="none"/>
    <rect x="134" y="134" width="34" height="114" rx="4" stroke="none"/>
    <rect x="122" y="242" width="58" height="18" rx="6" stroke="none"/>
    <rect x="219" y="120" width="58" height="18" rx="6" stroke="none"/>
    <rect x="231" y="134" width="34" height="114" rx="4" stroke="none"/>
    <rect x="219" y="242" width="58" height="18" rx="6" stroke="none"/>
    <rect x="0" y="280" width="302" height="22" rx="11" stroke="none"/>
  </g>
</svg>
