# NextBudget — minimal self-hosted deployment (app + Postgres)
#
#   docker compose up -d
#   docker compose exec app npm run db:migrate   # first run: create schema + seed
#
# Then open http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    container_name: nextbudget-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextbudget
      POSTGRES_PASSWORD: nextbudget # ⚠️ change me
      POSTGRES_DB: nextbudget
    volumes:
      - nextbudget-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextbudget"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # `image` is the tag CI publishes; `build` means `docker compose up` builds
    # the production image from this checkout rather than pulling that tag.
    image: ghcr.io/fallais/nextbudget:latest
    build: .
    container_name: nextbudget
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://nextbudget:nextbudget@db:5432/nextbudget
      TZ: Europe/Paris

volumes:
  nextbudget-pgdata:
