name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: a CVE can land in a dependency that nobody touched, so scanning
  # only on push would leave unchanged code silently rotting.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  # Leaked credentials. The app stores bank data, so a key committed by
  # accident is the worst thing that can happen to this repo.
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history — a secret removed in a later commit is still a leaked
          # secret, and a shallow clone would never see it.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Known CVEs in dependencies and in the lockfile.
  trivy-fs:
    name: Dependencies (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          # Report everything into the Security tab; the gate below is what
          # actually fails the build.
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        # Upload even when a later step fails, or findings would be invisible
        # exactly when they matter.
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Fail on fixable CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          # An unfixed CVE cannot be actioned by upgrading, so blocking on it
          # only teaches people to ignore this job.
          ignore-unfixed: true
          exit-code: "1"

  # The pipeline itself: unpinned actions, over-broad permissions, injectable
  # ${{ }} interpolation. Everything above trusts CI, so CI has to be sound.
  plumber:
    name: Pipeline (Plumber)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: getplumber/plumber@031bc86d1e5f661626e2000f4f8779912d608d5f # v0.4.39
        with:
          score-push: false
