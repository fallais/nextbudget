name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banquejs
          POSTGRES_PASSWORD: banquejs
          POSTGRES_DB: banquejs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banquejs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://banquejs:banquejs@localhost:5432/banquejs

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate # validates synchronize + seed against Postgres
      - run: npm run build
