name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the checkout. Without an explicit
# block the GITHUB_TOKEN inherits the repository default, which is wider than
# anything here needs.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nextbudget
          POSTGRES_PASSWORD: nextbudget
          POSTGRES_DB: nextbudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextbudget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://nextbudget:nextbudget@localhost:5432/nextbudget

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate # validates synchronize + seed against Postgres
      - run: npm run build
