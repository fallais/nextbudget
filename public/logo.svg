<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 96" width="352" height="96" role="img" aria-label="BanqueJS">
  <title>BanqueJS</title>
  <!-- Mark: neoclassical bank façade — pediment, three columns, plinth.
       Authored on the original 302×302 grid, scaled to 72px here. -->
  <g transform="translate(0 12) scale(0.238411)" fill="#0E2348">
    <path d="M151 6 L292 92 H10 Z" stroke="#0E2348" stroke-width="12" stroke-linejoin="round"/>
    <g>
      <rect x="25" y="120" width="58" height="18" rx="6"/>
      <rect x="37" y="134" width="34" height="114" rx="4"/>
      <rect x="25" y="242" width="58" height="18" rx="6"/>
    </g>
    <g>
      <rect x="122" y="120" width="58" height="18" rx="6"/>
      <rect x="134" y="134" width="34" height="114" rx="4"/>
      <rect x="122" y="242" width="58" height="18" rx="6"/>
    </g>
    <g>
      <rect x="219" y="120" width="58" height="18" rx="6"/>
      <rect x="231" y="134" width="34" height="114" rx="4"/>
      <rect x="219" y="242" width="58" height="18" rx="6"/>
    </g>
    <rect x="0" y="280" width="302" height="22" rx="11"/>
  </g>
  <!-- Wordmark. Inter is the app's UI face, so this matches in-product; the
       stack degrades to the platform grotesque elsewhere. -->
  <text x="92" y="62"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#0E2348">Banque</tspan><tspan fill="#1D6EF2">JS</tspan>
  </text>
</svg>
